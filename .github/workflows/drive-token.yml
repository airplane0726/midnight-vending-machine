# Google ドライブ用の短時間アクセストークンを、依頼者の公開鍵で暗号化して返す。
#
# - 画像や動画は扱わない（GitHub を通さない）。返すのは暗号化した 1 時間有効のトークンだけ。
# - ワークフローには権限を一切与えない（permissions: {}）。リポジトリの取り込みも外部アクションも使わない。
# - 入力は env 経由でだけ受け取り、シェルの命令文には埋め込まない。
# - mode=dummy はシークレットを使わず、ランダムな長い文字列を同じ方式で暗号化して返す（接続確認用）。
# - 依頼 ID を実行名と暗号文の認証対象に入れ、依頼と結果を対応付ける。
name: drive-token
run-name: drive-token ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "依頼 ID（16進32文字）"
        required: true
        type: string
      public_key:
        description: "依頼者の RSA 公開鍵（PEM を base64 にしたもの）"
        required: true
        type: string
      mode:
        description: "dummy（シークレットを使わない確認）または google"
        required: true
        type: choice
        options: [dummy, google]
        default: dummy

permissions: {}

concurrency:
  group: drive-token-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  issue:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Issue encrypted token
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          PUBLIC_KEY_B64: ${{ inputs.public_key }}
          MODE: ${{ inputs.mode }}
          # シークレットは mode=google のときだけ渡す（dummy では空文字）
          GOOGLE_OAUTH_CLIENT_ID: ${{ inputs.mode == 'google' && secrets.GOOGLE_OAUTH_CLIENT_ID || '' }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ inputs.mode == 'google' && secrets.GOOGLE_OAUTH_CLIENT_SECRET || '' }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ inputs.mode == 'google' && secrets.GOOGLE_DRIVE_REFRESH_TOKEN || '' }}
        run: |
          python3 - <<'DRIVE_TOKEN_PY'
          # --- BEGIN DRIVE TOKEN ISSUER (tests extract this block) ---
          import base64, hashlib, hmac, json, os, re, secrets, shutil, subprocess, sys, tempfile, time
          import urllib.error, urllib.parse, urllib.request

          PREFIX = "DRIVE_TOKEN_ENVELOPE"
          TOKEN_URL = "https://oauth2.googleapis.com/token"
          ABOUT_URL = "https://www.googleapis.com/drive/v3/about?fields=storageQuota"

          def fail(msg):
              print(f"DRIVE_TOKEN_ERROR {msg}")
              sys.exit(1)

          def local_override(name, default):
              # テスト専用: 127.0.0.1 宛ての URL だけ差し替えを認める
              v = os.environ.get(name, "")
              return v if v.startswith("http://127.0.0.1:") else default

          def b64(b):
              return base64.b64encode(b).decode("ascii")

          def run(args, data=None):
              return subprocess.run(args, input=data, capture_output=True, check=True).stdout

          request_id = os.environ.get("REQUEST_ID", "")
          mode = os.environ.get("MODE", "")
          if not re.fullmatch(r"[0-9a-f]{32}", request_id):
              fail("invalid request_id")
          if mode not in ("dummy", "google"):
              fail("invalid mode")
          try:
              pem = base64.b64decode(os.environ.get("PUBLIC_KEY_B64", ""), validate=True)
          except Exception:
              fail("public_key is not base64")
          if len(pem) > 4096 or not pem.startswith(b"-----BEGIN PUBLIC KEY-----"):
              fail("public_key is not a PEM public key")

          work = tempfile.mkdtemp(prefix="drive-token-")
          os.chmod(work, 0o700)
          try:
              pub = os.path.join(work, "pub.pem")
              with open(pub, "wb") as f:
                  f.write(pem)
              info = run(["openssl", "pkey", "-pubin", "-in", pub, "-noout", "-text"]).decode()
              m = re.search(r"Public-Key: \((\d+) bit\)", info)
              if not m or int(m.group(1)) < 3072 or "Modulus:" not in info:
                  fail("public_key must be RSA >= 3072 bits")

              quota = None
              if mode == "dummy":
                  token = "dummy-" + secrets.token_urlsafe(1536)  # 長いトークンを想定した確認用の値
                  expires_in = 3600
              else:
                  cid = os.environ.get("GOOGLE_OAUTH_CLIENT_ID", "")
                  csec = os.environ.get("GOOGLE_OAUTH_CLIENT_SECRET", "")
                  refresh = os.environ.get("GOOGLE_DRIVE_REFRESH_TOKEN", "")
                  if not (cid and csec and refresh):
                      fail("google secrets are not configured")
                  body = urllib.parse.urlencode({"grant_type": "refresh_token", "refresh_token": refresh,
                                                 "client_id": cid, "client_secret": csec}).encode()
                  req = urllib.request.Request(local_override("DRIVE_TOKEN_URL", TOKEN_URL), data=body, method="POST",
                                               headers={"Content-Type": "application/x-www-form-urlencoded"})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          tok = json.loads(r.read().decode())
                  except urllib.error.HTTPError as e:
                      fail(f"token endpoint HTTP {e.code}")
                  token = tok.get("access_token", "")
                  if not token:
                      fail("no access_token in response")
                  print(f"::add-mask::{token}")
                  expires_in = int(tok.get("expires_in", 3600))
                  # トークンが使えることを、ドライブの容量取得で確かめる（結果は暗号文の認証対象に含める）
                  req = urllib.request.Request(local_override("DRIVE_ABOUT_URL", ABOUT_URL),
                                               headers={"Authorization": f"Bearer {token}"})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          q = json.loads(r.read().decode())["storageQuota"]
                  except urllib.error.HTTPError as e:
                      fail(f"drive about HTTP {e.code}")
                  quota = {"limit": q.get("limit"), "usage": q.get("usage")}

              # ハイブリッド暗号: 64バイトの鍵（暗号化用32＋改ざん検出用32）を RSA-OAEP(SHA-256) で包み、
              # 本文は AES-256-CBC、改ざん検出は HMAC-SHA256（暗号化してから MAC）。長いトークンでも扱える。
              key = secrets.token_bytes(64)
              enc_key, mac_key = key[:32], key[32:]
              iv = secrets.token_bytes(16)
              wrapped = run(["openssl", "pkeyutl", "-encrypt", "-pubin", "-inkey", pub,
                             "-pkeyopt", "rsa_padding_mode:oaep", "-pkeyopt", "rsa_oaep_md:sha256",
                             "-pkeyopt", "rsa_mgf1_md:sha256"], data=key)
              ct = run(["openssl", "enc", "-aes-256-cbc", "-K", enc_key.hex(), "-iv", iv.hex()], data=token.encode())
              header = {"v": 1, "request_id": request_id, "mode": mode, "issued_at": int(time.time()),
                        "expires_in": expires_in, "quota": quota}
              header_b = json.dumps(header, sort_keys=True, separators=(",", ":")).encode()
              mac = hmac.new(mac_key, b"|".join([header_b, wrapped, iv, ct]), hashlib.sha256).digest()
              env = {"h": b64(header_b), "k": b64(wrapped), "iv": b64(iv), "ct": b64(ct), "mac": b64(mac)}
              print(f"{PREFIX} {request_id} {b64(json.dumps(env, separators=(',', ':')).encode())}")
          finally:
              shutil.rmtree(work, ignore_errors=True)
          # --- END DRIVE TOKEN ISSUER ---
          DRIVE_TOKEN_PY
